<style>
  #tankuj-prototype {
    --tk-bg: light-dark(#f4f5f0, #151b17);
    --tk-paper: light-dark(#ffffff, #202923);
    --tk-ink: light-dark(#17271e, #edf3ea);
    --tk-muted: light-dark(#526457, #b2c1b5);
    --tk-line: light-dark(#dde4da, #39473d);
    --tk-green: light-dark(#286043, #a9d7ac);
    --tk-on-green: light-dark(#ffffff, #143820);
    --tk-soft: light-dark(#e6eee1, #2a3e2c);
    --tk-error: light-dark(#a22c27, #ffb4ab);
    --tk-error-bg: light-dark(#fff0ed, #412822);
    --tk-warm: light-dark(#f3ebd6, #3c3522);
    --tk-radius: 20px;
    color: var(--tk-ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.5;
    background: transparent;
  }
  #tankuj-prototype * { box-sizing: border-box; }
  #tankuj-prototype [hidden] { display: none !important; }
  #tankuj-prototype button,
  #tankuj-prototype input,
  #tankuj-prototype select { font: inherit; }
  #tankuj-prototype button { touch-action: manipulation; }
  #tankuj-prototype h1,
  #tankuj-prototype h2,
  #tankuj-prototype h3,
  #tankuj-prototype p { margin: 0; }
  #tankuj-prototype h1 { font-size: 30px; font-weight: 500; line-height: 1.16; letter-spacing: -1px; }
  #tankuj-prototype h2 { font-size: 20px; font-weight: 500; line-height: 1.3; letter-spacing: -.4px; }
  #tankuj-prototype h3 { font-size: 16px; font-weight: 500; }
  #tankuj-prototype .tk-stage { padding: 20px 12px 26px; }
  #tankuj-prototype .tk-preview-controls { max-width: 400px; margin: 0 auto 16px; padding-right: 48px; }
  #tankuj-prototype .tk-preview-controls label { display: block; font-size: 12px; }
  #tankuj-prototype .tk-preview-controls select { max-width: 100%; min-height: 44px; padding: 6px 8px; color: var(--tk-ink); background: var(--tk-paper); border: 1px solid var(--tk-line); border-radius: 10px; font-size: 14px; }
  #tankuj-prototype .tk-caption { margin-top: 6px; font-size: 12px; color: var(--tk-muted); }
  #tankuj-prototype .tk-device { max-width: 400px; margin: auto; background: var(--tk-bg); border: 1px solid var(--tk-line); border-radius: 32px; overflow: clip; box-shadow: 0 15px 45px light-dark(#17271e12, #00000030); }
  #tankuj-prototype .tk-status { display: flex; justify-content: space-between; padding: 14px 24px 6px; font-size: 12px; font-weight: 500; }
  #tankuj-prototype .tk-status span:last-child { color: var(--tk-muted); font-size: 11px; font-weight: 400; letter-spacing: .4px; }
  #tankuj-prototype .tk-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 20px 14px; }
  #tankuj-prototype .tk-brand { font-size: 24px; font-weight: 500; letter-spacing: -1.4px; color: var(--tk-green); }
  #tankuj-prototype .tk-wordmark { font-size: 48px; font-weight: 500; letter-spacing: -3px; color: var(--tk-green); }
  #tankuj-prototype .tk-main { padding: 10px 20px 26px; min-height: 420px; }
  #tankuj-prototype .tk-stack { display: grid; gap: 20px; }
  #tankuj-prototype .tk-tight { display: grid; gap: 10px; }
  #tankuj-prototype .tk-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #tankuj-prototype .tk-row > * { min-width: 0; }
  #tankuj-prototype .tk-muted { color: var(--tk-muted); }
  #tankuj-prototype .tk-small { font-size: 13px; }
  #tankuj-prototype .tk-eyebrow { color: var(--tk-muted); font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; }
  #tankuj-prototype .tk-title { margin-bottom: 6px; }
  #tankuj-prototype .tk-summary { padding: 22px; background: var(--tk-paper); border-radius: var(--tk-radius); }
  #tankuj-prototype .tk-amount { margin: 8px 0 4px; font-size: 42px; font-weight: 500; line-height: 1.15; letter-spacing: -1.8px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  #tankuj-prototype .tk-amount small { font-size: 23px; font-weight: 400; letter-spacing: -.5px; }
  #tankuj-prototype .tk-consumption { padding-top: 18px; margin-top: 18px; border-top: 1px solid var(--tk-line); }
  #tankuj-prototype .tk-consumption strong { font-size: 28px; font-weight: 500; letter-spacing: -.8px; }
  #tankuj-prototype .tk-note { padding: 16px; border-radius: 16px; background: var(--tk-soft); }
  #tankuj-prototype .tk-note.tk-warning { background: var(--tk-warm); }
  #tankuj-prototype .tk-note p + p { margin-top: 6px; }
  #tankuj-prototype .tk-action { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 16px; border: 0; border-radius: 14px; color: var(--tk-on-green); background: var(--tk-green); font-weight: 500; text-decoration: none; }
  #tankuj-prototype .tk-action.tk-secondary { background: var(--tk-soft); color: var(--tk-green); }
  #tankuj-prototype .tk-action.tk-danger { background: var(--tk-error-bg); color: var(--tk-error); }
  #tankuj-prototype .tk-action.tk-full { width: 100%; }
  #tankuj-prototype .tk-action:disabled { opacity: .6; }
  #tankuj-prototype .tk-link { min-height: 44px; padding: 8px 0; border: 0; background: transparent; color: var(--tk-green); text-align: left; font-size: 14px; }
  #tankuj-prototype .tk-link.tk-danger { color: var(--tk-error); }
  #tankuj-prototype .tk-list { background: var(--tk-paper); border-radius: var(--tk-radius); padding: 0 16px; }
  #tankuj-prototype .tk-record { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 84px; padding: 14px 0; color: var(--tk-ink); background: transparent; border: 0; text-align: left; }
  #tankuj-prototype .tk-record + .tk-record { border-top: 1px solid var(--tk-line); }
  #tankuj-prototype .tk-record .tk-right { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #tankuj-prototype .tk-record strong { font-weight: 500; }
  #tankuj-prototype .tk-badge { display: inline-block; margin-top: 3px; padding: 2px 7px; border-radius: 6px; background: var(--tk-soft); color: var(--tk-green); font-size: 11px; }
  #tankuj-prototype .tk-nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 10px 12px 22px; gap: 6px; background: var(--tk-paper); border-top: 1px solid var(--tk-line); }
  #tankuj-prototype .tk-nav button { min-height: 48px; border: 0; border-radius: 12px; background: transparent; color: var(--tk-muted); font-size: 12px; }
  #tankuj-prototype .tk-nav button[aria-current="page"] { color: var(--tk-green); background: var(--tk-soft); font-weight: 500; }
  #tankuj-prototype .tk-form label { display: grid; gap: 6px; font-weight: 500; }
  #tankuj-prototype .tk-form input:not([type="checkbox"]) { width: 100%; min-height: 52px; padding: 12px 14px; border: 1px solid var(--tk-line); border-radius: 12px; color: var(--tk-ink); background: var(--tk-paper); font-weight: 400; font-variant-numeric: tabular-nums; }
  #tankuj-prototype .tk-form input[aria-invalid="true"] { border-color: var(--tk-error); }
  #tankuj-prototype .tk-form small { font-size: 12px; font-weight: 400; color: var(--tk-muted); }
  #tankuj-prototype .tk-form .tk-switch { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 14px 0; min-height: 52px; font-weight: 400; }
  #tankuj-prototype input[type="checkbox"] { accent-color: var(--tk-green); width: 23px; height: 23px; flex-shrink: 0; margin: 3px 0; }
  #tankuj-prototype fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  #tankuj-prototype legend { margin-bottom: 8px; font-size: 14px; }
  #tankuj-prototype .tk-segment { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--tk-soft); border-radius: 12px; }
  #tankuj-prototype .tk-segment button { padding: 10px 8px; min-height: 44px; border: 0; border-radius: 9px; color: var(--tk-muted); background: transparent; }
  #tankuj-prototype .tk-segment button[aria-pressed="true"] { color: var(--tk-ink); background: var(--tk-paper); font-weight: 500; }
  #tankuj-prototype details { border-top: 1px solid var(--tk-line); padding-top: 10px; }
  #tankuj-prototype summary { min-height: 44px; padding: 10px 0; color: var(--tk-green); font-size: 14px; }
  #tankuj-prototype .tk-error { color: var(--tk-error); font-size: 13px; }
  #tankuj-prototype .tk-alert { background: var(--tk-error-bg); color: var(--tk-error); border-radius: 12px; padding: 12px; font-size: 14px; }
  #tankuj-prototype .tk-success-mark { display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; background: var(--tk-soft); color: var(--tk-green); border-radius: 50%; font-size: 27px; }
  #tankuj-prototype .tk-divider { height: 1px; background: var(--tk-line); margin: 4px 0; }
  #tankuj-prototype .tk-metric-line { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--tk-line); }
  #tankuj-prototype .tk-metric-line > :last-child { text-align: right; font-variant-numeric: tabular-nums; }
  #tankuj-prototype .tk-chart-row { display: grid; grid-template-columns: 84px minmax(0, 1fr) 54px; gap: 8px; align-items: center; margin-top: 16px; font-size: 13px; }
  #tankuj-prototype .tk-track { background: var(--tk-soft); height: 8px; border-radius: 4px; }
  #tankuj-prototype .tk-bar { background: var(--tk-green); height: 100%; border-radius: 4px; }
  #tankuj-prototype .tk-modal-wrap { background: var(--tk-bg); }
  #tankuj-prototype .tk-dialog { margin-top: 12px; padding: 20px; background: var(--tk-paper); border: 1px solid var(--tk-line); border-radius: 20px; }
  #tankuj-prototype .tk-dialog .tk-action { margin-top: 8px; }
  #tankuj-prototype .tk-home-indicator { width: 100px; height: 4px; border-radius: 4px; background: var(--tk-muted); margin: 0 auto 9px; opacity: .45; }
  #tankuj-prototype.tk-large-text { font-size: 20px; }
  #tankuj-prototype.tk-large-text .tk-small,
  #tankuj-prototype.tk-large-text .tk-form small,
  #tankuj-prototype.tk-large-text .tk-link,
  #tankuj-prototype.tk-large-text .tk-record,
  #tankuj-prototype.tk-large-text .tk-chart-row { font-size: 17px; }
  #tankuj-prototype.tk-large-text .tk-row { flex-wrap: wrap; }
  @media (max-width: 380px) {
    #tankuj-prototype .tk-stage { padding: 14px 0; }
    #tankuj-prototype .tk-main { padding: 8px 16px 22px; }
    #tankuj-prototype .tk-top { padding-inline: 16px; }
    #tankuj-prototype .tk-summary { padding: 18px; }
    #tankuj-prototype .tk-amount { font-size: 37px; }
    #tankuj-prototype .tk-device { border-radius: 24px; }
    #tankuj-prototype .tk-preview-controls { padding-left: 8px; }
  }
</style>
<div id="tankuj-prototype" lang="sk">
  <div class="tk-stage viz-dotted-background">
    <div class="tk-preview-controls">
      <label for="tk-scenario">Scenár náhľadu</label>
      <select id="tk-scenario">
        <option value="history">Pravidelné používanie</option>
        <option value="start">Prvé otvorenie</option>
        <option value="first">Prvá plná nádrž</option>
        <option value="partial">Čiastočné tankovanie</option>
        <option value="gap">Vynechané tankovanie</option>
        <option value="save-error">Chyba uloženia</option>
        <option value="loading">Načítanie údajov</option>
        <option value="database-error">Nedostupné údaje</option>
      </select>
      <p class="tk-caption">Klikateľný návrh · vymyslené údaje · zmeny iba v náhľade</p>
    </div>
    <section class="tk-device" aria-label="Tankuj — návrh mobilnej aplikácie">
      <div class="tk-status" aria-hidden="true"><span>9:41</span><span>100 %</span></div>
      <div class="tk-top"><span class="tk-brand">tankuj.</span><button class="tk-link cursor-interaction" type="button" data-action="settings">Nastavenia</button></div>
      <main class="tk-main" id="tk-screen"></main>
      <nav class="tk-nav" aria-label="Hlavná navigácia" id="tk-nav">
        <button class="cursor-interaction" data-screen="overview" type="button" aria-current="page">Prehľad</button>
        <button class="cursor-interaction" data-screen="history" type="button">História</button>
        <button class="cursor-interaction" data-screen="stats" type="button">Štatistiky</button>
      </nav>
      <div class="tk-home-indicator" aria-hidden="true"></div>
    </section>
  </div>
  <div id="tk-announcement" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>
</div>
<script>
(() => {
  "use strict";
  const root = document.getElementById("tankuj-prototype");
  const screen = root.querySelector("#tk-screen");
  const navigation = root.querySelector("#tk-nav");
  const scenarioSelect = root.querySelector("#tk-scenario");
  const referenceDate = "2026-10-19";
  const scenarios = new Set(Array.from(scenarioSelect.options, option => option.value));
  const views = new Set(["onboarding", "overview", "history", "stats", "form", "success", "detail", "settings", "loading", "database-error", "restore"]);
  const sampleRecords = [
    { id: "sample-1", date: "2026-09-28", odo: 124200, liters: 42, amount: 65.10, full: true, mode: "amount" },
    { id: "sample-2", date: "2026-10-05", odo: 124520, liters: 20, amount: 30.60, full: false, mode: "amount" },
    { id: "sample-3", date: "2026-10-12", odo: 124980, liters: 28, amount: 44.52, full: true, mode: "amount" },
    { id: "sample-4", date: "2026-10-19", odo: 125560, liters: 35.96, amount: 56.10, full: true, mode: "amount" }
  ];
  let state;
  let draft = null;
  let formOrigin = "overview";
  let selectedId = null;
  let notice = "";
  let modal = null;
  let busy = false;
  let pendingMode = null;
  let lastSaveWasEdit = false;
  const presentation = { largeText: false };
  const clone = value => JSON.parse(JSON.stringify(value));
  const escape = value => String(value).replace(/[&<>"']/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
  const number = (value, places = 2) => new Intl.NumberFormat("sk-SK", { minimumFractionDigits: places, maximumFractionDigits: places }).format(value);
  const money = value => number(value) + " €";
  const countLabel = (value, one, few, many) => value + " " + (value === 1 ? one : value >= 2 && value <= 4 ? few : many);
  const dateLabel = date => new Intl.DateTimeFormat("sk-SK", { day: "numeric", month: "numeric" }).format(new Date(date + "T12:00:00"));
  const fullDateLabel = date => new Intl.DateTimeFormat("sk-SK", { day: "numeric", month: "numeric", year: "numeric" }).format(new Date(date + "T12:00:00"));
  const isCalendarDate = date => typeof date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(date) && !Number.isNaN(Date.parse(date)) && new Date(date + "T12:00:00Z").toISOString().slice(0, 10) === date;
  const sorted = () => [...state.records].sort((a, b) => a.date.localeCompare(b.date) || a.odo - b.odo);
  const action = (label, name, extra = "") => '<button type="button" class="tk-action tk-full cursor-interaction ' + extra + '" data-action="' + name + '">' + label + "</button>";
  const heading = (title, subtitle = "") => '<div><h1 class="tk-title">' + title + "</h1>" + (subtitle ? '<p class="tk-muted tk-small">' + subtitle + "</p>" : "") + "</div>";
  const metric = (label, value) => '<div class="tk-metric-line"><span class="tk-muted tk-small">' + label + "</span><span>" + value + "</span></div>";
  function announce(message) { root.querySelector("#tk-announcement").textContent = message; }
  function reset(scenario) {
    const records = scenario === "start" ? [] : scenario === "first" ? sampleRecords.slice(0, 1) : scenario === "partial" ? sampleRecords.slice(0, 2) : sampleRecords;
    state = { scenario, screen: scenario === "start" ? "onboarding" : scenario === "loading" ? "loading" : scenario === "database-error" ? "database-error" : "overview", vehicle: { name: "Moje auto", fuel: "Benzín" }, records: clone(records), gaps: scenario === "gap" ? [{ id: "sample-gap", odo: 124980 }] : [], failNextSave: scenario === "save-error" };
    draft = null; modal = null; notice = ""; selectedId = null; busy = false;
    scenarioSelect.value = scenario;
    render();
  }
  function measurement() {
    const intervals = [];
    let baseline = null;
    let liters = 0;
    let lastGap = null;
    for (const record of sorted()) {
      if (baseline && state.gaps.some(gap => gap.odo > baseline.odo && gap.odo <= record.odo)) {
        baseline = null; liters = 0; lastGap = record;
      }
      if (!baseline) {
        if (record.full) baseline = record;
        continue;
      }
      liters += record.liters;
      if (record.full) {
        intervals.push({ start: baseline, end: record, liters, km: record.odo - baseline.odo, value: liters / (record.odo - baseline.odo) * 100 });
        baseline = record; liters = 0;
      }
    }
    const totalKm = intervals.reduce((sum, interval) => sum + interval.km, 0);
    const totalLiters = intervals.reduce((sum, interval) => sum + interval.liters, 0);
    const latest = sorted().at(-1);
    const pendingGap = latest && state.gaps.some(gap => gap.odo > latest.odo);
    return { intervals, baseline, lastGap, pendingGap, value: totalKm ? totalLiters / totalKm * 100 : null, totalKm };
  }
  function measurementNote() {
    const result = measurement();
    if (result.pendingGap) return "Po vynechanom tankovaní začneme merať od ďalšej plnej nádrže.";
    if (!result.baseline) return "Pri najbližšom tankovaní do plnej začneme merať spotrebu.";
    const latest = sorted().at(-1);
    if (latest && !latest.full) return "Tankovanie je zapísané. Spotrebu dopočítame pri ďalšej plnej nádrži.";
    if (!result.intervals.length) return "Prvá plná nádrž je základ. Spotrebu uvidíš po ďalšom tankovaní do plnej.";
    return "Počítame z úplných intervalov medzi plnými nádržami.";
  }
  function recordRow(record) {
    return '<button type="button" class="tk-record cursor-interaction" data-record="' + escape(record.id) + '"><span><strong>' + fullDateLabel(record.date) + '</strong><br><span class="tk-muted tk-small">' + number(record.odo, 0) + ' km</span><br><span class="tk-badge">' + (record.full ? "Plná nádrž" : "Čiastočné") + '</span></span><span class="tk-right"><strong>' + money(record.amount) + '</strong><br><span class="tk-muted tk-small">' + number(record.liters, 2) + " l</span></span></button>";
  }
  function overview() {
    const result = measurement();
    const records = sorted();
    const october = records.filter(record => record.date.startsWith("2026-10"));
    const spend = october.reduce((sum, record) => sum + record.amount, 0);
    const latest = records.at(-1);
    const previous = records.at(-2);
    const difference = latest && previous ? latest.amount / latest.liters - previous.amount / previous.liters : null;
    let content = '<div class="tk-stack">' + heading("Tvoje jazdy.<br>Jasnejšie.", escape(state.vehicle.name) + " · " + escape(state.vehicle.fuel));
    content += '<section class="tk-summary" aria-label="Súhrn tankovaní"><p class="tk-eyebrow">Zaplatené v októbri</p><div class="tk-amount">' + number(spend) + ' <small>€</small></div><p class="tk-muted tk-small">' + countLabel(october.length, "evidované tankovanie", "evidované tankovania", "evidovaných tankovaní") + ' · október 2026</p><div class="tk-consumption"><div class="tk-row"><span class="tk-muted tk-small">Priemerná spotreba</span><span>' + (result.value === null ? "—" : "<strong>" + number(result.value) + "</strong>") + '</span></div><p class="tk-muted tk-small">' + (result.value === null ? "Zatiaľ bez platného merania" : "l/100 km · " + countLabel(result.intervals.length, "platný interval", "platné intervaly", "platných intervalov")) + "</p></div></section>";
    content += action("+ Pridať tankovanie", "add");
    if (result.value === null || (latest && !latest.full) || state.gaps.length) {
      content += '<section class="tk-note ' + (state.gaps.length ? "tk-warning" : "") + '"><h3>' + (state.gaps.length ? "Pokračujeme v meraní" : "Každý záznam sa počíta") + '</h3><p class="tk-small">' + measurementNote() + (state.gaps.length && result.value !== null ? " Neúplné úseky vynechávame." : "") + "</p></section>";
    } else if (difference !== null) {
      const priceText = Math.abs(difference) < .0005 ? "Pri posledných dvoch tankovaniach bola cena za liter rovnaká." : "Pri poslednom tankovaní bol liter o " + number(Math.abs(difference), 3) + " € " + (difference < 0 ? "lacnejší." : "drahší.");
      content += '<section class="tk-note"><p class="tk-eyebrow">Malé zistenie</p><h3 style="margin-top:6px">Tvoja cena paliva</h3><p class="tk-small" style="margin-top:6px">' + priceText + '</p><p class="tk-muted tk-small">' + fullDateLabel(previous.date) + " → " + fullDateLabel(latest.date) + "</p></section>";
    }
    content += '<section><div class="tk-row"><h2>Posledné tankovanie</h2><button class="tk-link cursor-interaction" type="button" data-screen="history">História →</button></div>';
    content += latest ? '<div class="tk-list">' + recordRow(latest) + "</div>" : '<p class="tk-muted tk-small">Tvoja história sa začne prvým tankovaním.</p>';
    return content + "</section></div>";
  }
  function history() {
    const records = sorted().reverse();
    return '<div class="tk-stack">' + heading("História", "Každé tankovanie na svojom mieste.") + action("+ Pridať tankovanie", "add") + (records.length ? '<div class="tk-list">' + records.map(recordRow).join("") + "</div>" : '<section class="tk-note"><h2>Zatiaľ bez záznamov</h2><p class="tk-small">Zapíš prvé tankovanie. Hneď uvidíš litre, sumu a cenu za liter.</p></section>') + "</div>";
  }
  function stats() {
    const result = measurement();
    const records = sorted();
    const sum = key => records.reduce((total, record) => total + record[key], 0);
    let html = '<div class="tk-stack">' + heading("Štatistiky", "Vlastné údaje. Zrozumiteľné súvislosti.");
    html += '<section class="tk-summary"><p class="tk-eyebrow">Celková spotreba</p><div class="tk-amount">' + (result.value === null ? "—" : number(result.value)) + '</div><p class="tk-muted tk-small">l/100 km · vážené vzdialenosťou</p>';

    if (name === "delete-real" || name === "delete-wrong") {
      const record = state.records.find(item => item.id === selectedId);
      if (name === "delete-real") state.gaps.push({ id: "deleted-" + record.id, odo: record.odo });
      state.records = state.records.filter(item => item.id !== selectedId);
      selectedId = null; modal = null; navigate("history"); announce("Záznam vymazaný.");
    }
  });
  root.addEventListener("keydown", event => {
    if (event.key === "Tab" && modal) {
      const buttons = [...screen.querySelectorAll(".tk-dialog button")];
      if (event.shiftKey && document.activeElement === buttons[0]) { event.preventDefault(); buttons.at(-1).focus(); }
      if (!event.shiftKey && document.activeElement === buttons.at(-1)) { event.preventDefault(); buttons[0].focus(); }
    }
    if (event.key === "Escape") {
      if (modal) { modal = null; render(); }
      else if (state.screen === "form") closeForm();
    }
  });
  reset("history");
  if (window.openai && window.openai.widgetState) restoreSnapshot(window.openai.widgetState.privateContent);
  window.addEventListener("openai:set_globals", event => {
    const globals = event.detail && event.detail.globals;
    if (globals && globals.widgetState) restoreSnapshot(globals.widgetState.privateContent);
  });
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root.querySelector(".tk-device"), onChange: () => root.classList.toggle("tk-large-text", presentation.largeText) });
    tweak.addToggle(presentation, "largeText", { label: "Zväčšený text" });
  }
})();
</script>
